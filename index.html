<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🌌 Jupiter</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- ICONS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      🌌 Jupiter
    </div>

    <nav>

      <button class="menu active">
        <i class="fa-solid fa-house"></i>
        Dashboard
      </button>

      <button class="menu">
        <i class="fa-solid fa-list-check"></i>
        Tarefas
      </button>

      <button class="menu">
        <i class="fa-solid fa-calendar"></i>
        Agenda
      </button>

    </nav>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOP -->
    <header class="topbar">

      <div>

        <h1>Dashboard Operacional</h1>

        <p>
          Gerenciamento de tarefas
        </p>

      </div>

      <button class="theme-btn">

        <i class="fa-solid fa-moon"></i>

      </button>

    </header>

    <!-- KPI -->
    <section class="kpis">

      <div class="kpi-card">

        <span>Total</span>

        <h2 id="kpiTotal">
          0
        </h2>

      </div>

      <div class="kpi-card">

        <span>Concluídas</span>

        <h2 id="kpiDone">
          0
        </h2>

      </div>

      <div class="kpi-card">

        <span>Pendentes</span>

        <h2 id="kpiPending">
          0
        </h2>

      </div>

    </section>

    <!-- GRID -->
    <section class="grid">

      <!-- FORM -->
      <div class="card">

        <h3>
          📝 Nova tarefa
        </h3>

        <input
          type="text"
          id="taskTitle"
          placeholder="Título da tarefa"
        >

        <textarea
          id="taskDescription"
          placeholder="Descrição"
        ></textarea>

        <select id="taskStatus">

          <option>
            Em andamento
          </option>

          <option>
            Pausado
          </option>

          <option>
            Concluído
          </option>

        </select>

        <button id="addTaskBtn">

          Adicionar tarefa

        </button>

      </div>

      <!-- TASKS -->
      <div class="card">

        <div class="task-header">

          <h3>
            📋 Tarefas
          </h3>

          <input
            type="text"
            id="searchInput"
            placeholder="Pesquisar"
          >

        </div>

        <div id="taskList"></div>

      </div>

    </section>

  </main>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
